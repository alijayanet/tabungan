<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline</title>
  <style>
    body { font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background:#f7fafc; color:#1f2937; margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { background:#fff; border-radius:16px; box-shadow:0 10px 25px rgba(0,0,0,0.1); padding:24px; max-width:360px; text-align:center; }
    .title { font-weight:700; font-size:18px; margin-bottom:8px; }
    .desc { font-size:14px; color:#6b7280; margin-bottom:16px; }
    .btn { display:inline-block; padding:10px 14px; border-radius:10px; background:#2563eb; color:#fff; text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">Anda sedang offline</div>
    <div class="desc">Periksa koneksi internet Anda. Beberapa fitur mungkin tidak tersedia.</div>
    <a href="/" class="btn">Kembali ke Beranda</a>
  </div>
</body>
</html>
